<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/logo.png">
<title>Новая вкладка</title>
<style>
:root{
  --bg:#16161a;
  --card:rgba(30,30,38,.72);
  --card-hi:rgba(46,46,58,.9);
  --border:rgba(255,255,255,.09);
  --text:#eaeaf0;
  --muted:#a2a2b0;
  --accent:#5b9cff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  font-size:14px;line-height:1.5;
  overflow-x:hidden;overflow-y:auto;
  user-select:none;-webkit-user-select:none;
}
#bgmedia{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--bg)}
#bgmedia img,#bgmedia video{width:100%;height:100%;object-fit:cover;display:block}
#scrim{position:fixed;inset:0;z-index:-1;background:rgba(8,8,12,.45)}
body.plain #scrim{display:none}

main{
  min-height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;padding:48px 24px 36px;
}
.head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.clock{font-size:72px;font-weight:200;letter-spacing:1px;line-height:1.05;font-variant-numeric:tabular-nums}
.greet{font-size:17px;color:var(--muted)}
.date{font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);opacity:.7}

form.search{width:100%;max-width:560px;position:relative}
#q{
  width:100%;height:52px;border-radius:26px;border:1px solid var(--border);
  background:var(--card);color:var(--text);
  padding:0 54px 0 22px;font-size:15px;font-family:inherit;outline:none;
  backdrop-filter:blur(14px);
  user-select:text;-webkit-user-select:text;
  transition:border-color .15s,background .15s;
}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--accent);background:var(--card-hi)}
form.search button{
  position:absolute;right:7px;top:7px;width:38px;height:38px;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
form.search button:hover{background:rgba(255,255,255,.1);color:var(--text)}
form.search button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

.links{
  display:grid;grid-template-columns:repeat(auto-fit,94px);gap:12px;justify-content:center;
  width:100%;max-width:560px;
}
.link{
  position:relative;height:86px;border-radius:16px;
  background:var(--card);border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  color:var(--text);cursor:pointer;backdrop-filter:blur(14px);
  transition:transform .14s ease,background .14s ease;
}
.link:hover{background:var(--card-hi);transform:translateY(-2px)}
.link .ic{
  width:32px;height:32px;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.09);font-size:14px;font-weight:600;color:var(--muted);
}
.link .ic img{width:20px;height:20px}
.link .nm{font-size:11.5px;color:var(--muted);max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .rm{
  position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:18px;text-align:center;
  opacity:0;transition:opacity .12s;
}
.link:hover .rm{opacity:1}
.link.add{border-style:dashed;color:var(--muted);font-size:21px;align-items:center;justify-content:center}

.ai{
  width:100%;max-width:560px;border-radius:18px;border:1px solid var(--border);
  background:var(--card);backdrop-filter:blur(14px);padding:14px;
}
.ai .hd{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:10px}
.ai .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ai .row{display:flex;gap:8px}
.ai input{
  flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--border);
  background:rgba(0,0,0,.3);color:var(--text);padding:0 14px;font-size:13.5px;
  font-family:inherit;outline:none;user-select:text;-webkit-user-select:text;
}
.ai input:focus{border-color:var(--accent)}
.ai button{
  width:40px;height:40px;flex:0 0 40px;border:0;border-radius:12px;
  background:var(--accent);color:#08111f;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.ai button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#aiOut{
  display:none;margin-top:12px;padding:12px;border-radius:12px;
  background:rgba(0,0,0,.34);font-size:13px;line-height:1.6;
  white-space:pre-wrap;max-height:230px;overflow-y:auto;
  user-select:text;-webkit-user-select:text;
}
#aiWait{display:none;margin-top:12px;font-size:12.5px;color:var(--muted)}

.hint{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:11.5px;color:var(--muted);opacity:.65}
.hint kbd{
  background:rgba(255,255,255,.1);border-radius:5px;padding:2px 6px;
  font-family:inherit;font-size:10.5px;margin-right:6px;
}
</style>
</head>
<body>
<div id="bgmedia"></div>
<div id="scrim"></div>

<main>
  <div class="head">
    <div class="clock" id="clock" hidden></div>
    <div class="greet" id="greet" hidden></div>
    <div class="date" id="date" hidden></div>
  </div>

  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="text" placeholder="Поиск или адрес" spellcheck="false">
    <button type="submit" aria-label="Найти">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    </button>
  </form>

  <div class="links" id="links"></div>

  <section class="ai" id="ai" hidden>
    <div class="hd"><span class="dot"></span>AI Ассистент</div>
    <div class="row">
      <input id="aiIn" type="text" placeholder="Спросите что угодно...">
      <button id="aiGo" aria-label="Отправить">
        <svg viewBox="0 0 24 24"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div id="aiWait">Думаю...</div>
    <div id="aiOut"></div>
  </section>

  <div class="hint">
    <span><kbd>Ctrl+T</kbd>новая вкладка</span>
    <span><kbd>Ctrl+L</kbd>адрес</span>
    <span><kbd>Ctrl+F</kbd>поиск на странице</span>
    <span><kbd>F11</kbd>во весь экран</span>
  </div>
</main>

<script>
function post(cmd, data) {
  var m = Object.assign({ cmd: cmd }, data || {});
  var s = JSON.stringify(m);
  try { if (window.ipc && window.ipc.postMessage) return window.ipc.postMessage(s); } catch (e) {}
  try { window.webkit.messageHandlers.ipc.postMessage(s); } catch (e) {}
}

var cfg = window.__NTP__ || {};
var links = (cfg.quick_links || []).slice();

/* ---------- background ---------- */
(function () {
  var box = document.getElementById('bgmedia');
  if (cfg.bg_color) { document.body.style.background = cfg.bg_color; box.style.background = cfg.bg_color; }
  if (cfg.bg_video) {
    var v = document.createElement('video');
    v.src = cfg.bg_video;
    v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
    box.appendChild(v);
  } else if (cfg.bg_image) {
    var i = document.createElement('img');
    i.src = cfg.bg_image;
    i.alt = '';
    box.appendChild(i);
  } else {
    document.body.classList.add('plain');
  }
})();

/* ---------- clock, greeting, date ---------- */
function two(n) { return (n < 10 ? '0' : '') + n; }
function tick() {
  var now = new Date();
  if (cfg.show_clock !== false) {
    var el = document.getElementById('clock');
    el.hidden = false;
    var h = now.getHours(), suffix = '';
    if (cfg.clock_format_24h === false) { suffix = h < 12 ? ' AM' : ' PM'; h = h % 12 || 12; }
    el.textContent = two(h) + ':' + two(now.getMinutes()) + suffix;
    if (cfg.clock_color) el.style.color = cfg.clock_color;
  }
  if (cfg.show_greeting !== false) {
    var g = document.getElementById('greet');
    g.hidden = false;
    var hh = now.getHours();
    g.textContent = hh < 5 ? 'Доброй ночи' : hh < 12 ? 'Доброе утро' : hh < 18 ? 'Добрый день' : 'Добрый вечер';
    if (cfg.greeting_color) g.style.color = cfg.greeting_color;
  }
  if (cfg.show_date !== false) {
    var d = document.getElementById('date');
    d.hidden = false;
    d.textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  }
}
tick();
setInterval(tick, 1000);

/* ---------- quick links ---------- */
function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return ''; }
}
function renderLinks() {
  var box = document.getElementById('links');
  box.innerHTML = '';
  links.forEach(function (l, idx) {
    var a = document.createElement('div');
    a.className = 'link';
    a.title = l.url;

    var ic = document.createElement('div');
    ic.className = 'ic';
    var host = hostOf(l.url);
    if (host) {
      var img = document.createElement('img');
      img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + host;
      img.alt = '';
      img.onerror = function () { ic.textContent = (l.name || host).charAt(0).toUpperCase(); img.remove(); };
      ic.appendChild(img);
    } else {
      ic.textContent = (l.name || '?').charAt(0).toUpperCase();
    }

    var nm = document.createElement('div');
    nm.className = 'nm';
    nm.textContent = l.name || host || l.url;

    var rm = document.createElement('div');
    rm.className = 'rm';
    rm.textContent = '\u00D7';
    rm.title = 'Удалить';
    rm.addEventListener('click', function (e) {
      e.stopPropagation();
      links.splice(idx, 1);
      renderLinks();
      post('save_links', { links: links });
    });

    a.appendChild(ic);
    a.appendChild(nm);
    a.appendChild(rm);
    a.addEventListener('click', function () { post('navigate', { url: l.url }); });
    box.appendChild(a);
  });

  var add = document.createElement('div');
  add.className = 'link add';
  add.title = 'Добавить ссылку';
  add.textContent = '+';
  add.addEventListener('click', function () {
    var url = prompt('Адрес сайта (например youtube.com)');
    if (!url) return;
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    var host = hostOf(url);
    var name = prompt('Название', host.replace(/^www\./, '')) || host;
    links.push({ name: name, url: url, icon: '' });
    renderLinks();
    post('save_links', { links: links });
  });
  box.appendChild(add);
}
renderLinks();

/* ---------- search ---------- */
var q = document.getElementById('q');
document.getElementById('searchForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var v = q.value.trim();
  if (!v) return;
  post('navigate', { url: v });
  q.value = '';
});

/* ---------- AI ---------- */
if (cfg.show_ai_chat !== false) document.getElementById('ai').hidden = false;
function askAi() {
  var input = document.getElementById('aiIn');
  var text = input.value.trim();
  if (!text) return;
  document.getElementById('aiOut').style.display = 'none';
  document.getElementById('aiWait').style.display = 'block';
  post('ai_chat', { ai_prompt: text });
  input.value = '';
}
document.getElementById('aiGo').addEventListener('click', askAi);
document.getElementById('aiIn').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) askAi();
});
window.__ruvaAi = function (text) {
  document.getElementById('aiWait').style.display = 'none';
  var out = document.getElementById('aiOut');
  out.textContent = text;
  out.style.display = 'block';
};

setTimeout(function () { q.focus(); }, 60);
</script>
</body>
</html>
