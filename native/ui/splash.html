<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;user-select:none}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:#0b0b0f;
  display:flex;align-items:center;justify-content:center;
}
.wrap{
  display:flex;flex-direction:column;align-items:center;gap:26px;
  animation:appear .5s ease both;
}
@keyframes appear{from{opacity:0}to{opacity:1}}
.logo-ring{
  position:relative;width:140px;height:140px;
  display:flex;align-items:center;justify-content:center;
}
.logo-ring::before{
  content:'';position:absolute;inset:-14px;border-radius:38px;
  background:radial-gradient(circle at 50% 50%,rgba(99,102,241,.28),transparent 70%);
  animation:glow 2.2s ease-in-out infinite;
}
@keyframes glow{0%,100%{opacity:.4;transform:scale(.96)}50%{opacity:1;transform:scale(1.05)}}
.logo{
  width:140px;height:140px;border-radius:32px;
  animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both;
  filter:drop-shadow(0 12px 40px rgba(0,0,0,.6));
}
@keyframes pop{
  0%{opacity:0;transform:scale(.55) translateY(24px)}
  60%{opacity:1;transform:scale(1.06) translateY(-4px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.name{
  font-size:26px;font-weight:600;letter-spacing:4px;color:#e7e7ec;
  animation:rise .7s .35s ease both;
}
.name span{color:#6366f1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.bar{
  width:180px;height:3px;border-radius:2px;background:#1e1e26;overflow:hidden;
  animation:rise .7s .5s ease both;
}
.bar i{
  display:block;height:100%;width:40%;border-radius:2px;
  background:linear-gradient(90deg,#6366f1,#8b8cf5);
  animation:slide 1.1s .5s ease-in-out infinite;
}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(460%)}}
.ver{font-size:11px;letter-spacing:2px;color:#3f3f4a;text-transform:uppercase;
  animation:rise .7s .65s ease both}
body.out{animation:fadeout .45s ease both}
@keyframes fadeout{to{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-ring"><img class="logo" src="__LOGO__" alt="Ruva Browser"></div>
  <div class="name">RUVA <span>BROWSER</span></div>
  <div class="bar"><i></i></div>
  <div class="ver">v0.3.0</div>
</div>
<script>
setTimeout(function(){
  document.body.classList.add('out');
  setTimeout(function(){
    try{window.ipc.postMessage(JSON.stringify({cmd:'splash_done'}))}catch(e){}
  },460);
},1700);
</script>
</body>
</html>
