<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a;display:flex;align-items:center;justify-content:center;
  height:100vh;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
.container{display:flex;flex-direction:column;align-items:center;gap:24px}
.logo-wrap{
  width:120px;height:120px;position:relative;
  animation:logoIn .8s cubic-bezier(.34,1.56,.64,1) forwards;
  opacity:0;
}
@keyframes logoIn{
  0%{opacity:0;transform:scale(.5) translateY(20px)}
  100%{opacity:1;transform:scale(1) translateY(0)}
}
.logo-wrap img{width:100%;height:100%;border-radius:28px}
.glow{
  position:absolute;top:-20px;left:-20px;right:-20px;bottom:-20px;
  background:radial-gradient(circle,rgba(59,130,246,.25) 0%,transparent 70%);
  border-radius:40px;animation:glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.ring{
  position:absolute;top:-8px;left:-8px;right:-8px;bottom:-8px;
  border:2px solid rgba(59,130,246,.3);border-radius:36px;
  animation:ringIn 1s .3s ease forwards;opacity:0;
}
@keyframes ringIn{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
.text{
  font-size:28px;font-weight:700;color:#fff;letter-spacing:2px;
  animation:textIn .6s .4s ease forwards;opacity:0;
}
.text span{color:#3b82f6}
@keyframes textIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
.subtitle{
  font-size:13px;color:#6b7280;letter-spacing:3px;text-transform:uppercase;
  animation:textIn .6s .6s ease forwards;opacity:0;
}
.loader{
  width:120px;height:2px;background:#1a1a1a;border-radius:2px;
  overflow:hidden;animation:textIn .6s .8s ease forwards;opacity:0;
}
.loader-bar{
  width:0;height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);
  border-radius:2px;animation:load 1.5s 1s ease forwards;
}
@keyframes load{0%{width:0}100%{width:100%}}
.dots{
  display:flex;gap:6px;animation:textIn .6s 1.2s ease forwards;opacity:0;
}
.dot{
  width:6px;height:6px;background:#333;border-radius:50%;
  animation:dotBounce 1.4s infinite;
}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes dotBounce{0%,80%,100%{background:#333;transform:scale(1)}40%{background:#3b82f6;transform:scale(1.3)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <div class="glow"></div>
    <div class="ring"></div>
    <img src="logo.png" alt="Ruva">
  </div>
  <div class="text">Ruva <span>Browser</span></div>
  <div class="subtitle">Windows Edition</div>
  <div class="loader"><div class="loader-bar"></div></div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
</body>
</html>
