<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ruva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  background:#0b0b0e;
  color:#e8e8ee;
  font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;
}
#glow{
  position:fixed;top:50%;left:50%;width:760px;height:760px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(91,156,255,.13),rgba(11,11,14,0) 62%);
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}

.stage{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.logo-wrap{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
.ring{
  position:absolute;inset:-16px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.08);
  border-top-color:rgba(91,156,255,.85);
  animation:spin 1.15s linear infinite;
}
.ring.two{
  inset:-30px;border-top-color:transparent;border-left-color:rgba(255,255,255,.22);
  animation:spin 2.1s linear infinite reverse;
}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{
  width:112px;height:112px;border-radius:26px;display:block;
  animation:pop .85s cubic-bezier(.16,1,.3,1) both;
  filter:drop-shadow(0 14px 34px rgba(0,0,0,.65));
}
@keyframes pop{0%{opacity:0;transform:scale(.72)}60%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}
.shine{
  position:absolute;top:10px;left:10px;width:112px;height:112px;border-radius:26px;
  overflow:hidden;pointer-events:none;
}
.shine::after{
  content:'';position:absolute;top:-60%;left:-140%;width:70%;height:220%;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));
  transform:rotate(18deg);
  animation:sweep 1.9s ease-in-out .55s 1 both;
}
@keyframes sweep{to{left:150%}}

.word{
  display:flex;gap:9px;font-size:25px;font-weight:600;letter-spacing:7px;
  color:#f2f2f6;
}
.word span{animation:letter .5s ease both}
.word span:nth-child(1){animation-delay:.30s}
.word span:nth-child(2){animation-delay:.38s}
.word span:nth-child(3){animation-delay:.46s}
.word span:nth-child(4){animation-delay:.54s}
@keyframes letter{from{opacity:0;transform:translateY(10px) scale(.9);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

.tag{
  font-size:11.5px;letter-spacing:3.2px;text-transform:uppercase;color:#7b7b8a;
  animation:fade .6s ease .75s both;
}
@keyframes fade{from{opacity:0}to{opacity:1}}

.track{width:190px;height:2px;border-radius:2px;background:#1d1d24;overflow:hidden}
.bar{
  height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#5b9cff,#9ecbff);
  animation:load 1.55s cubic-bezier(.4,.1,.2,1) .25s both;
}
@keyframes load{to{width:100%}}

body.out{animation:bye .28s ease forwards}
@keyframes bye{to{opacity:0}}
</style>
</head>
<body>
<div id="glow"></div>
<div class="stage">
  <div class="logo-wrap">
    <div class="ring"></div>
    <div class="ring two"></div>
    <img class="logo" src="/logo.png" alt="Ruva">
    <div class="shine"></div>
  </div>
  <div class="word"><span>R</span><span>U</span><span>V</span><span>A</span></div>
  <div class="tag">Быстрый браузер</div>
  <div class="track"><div class="bar"></div></div>
</div>
<script>
function post(cmd) {
  var s = JSON.stringify({ cmd: cmd });
  try { if (window.ipc && window.ipc.postMessage) return window.ipc.postMessage(s); } catch (e) {}
  try { window.webkit.messageHandlers.ipc.postMessage(s); } catch (e) {}
}
setTimeout(function () { document.body.classList.add('out'); }, 1850);
setTimeout(function () { post('splash_done'); }, 2150);
</script>
</body>
</html>
