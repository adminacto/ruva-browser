<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root{--bg:#202124;--bg-hover:#28292c;--active:#3c3d41;--fg:#e8eaed;--muted:#9aa0a6;--accent:#8ab4f8}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;-webkit-user-select:none;user-select:none}
html,body{background:var(--bg);overflow:hidden;height:100%}
#tabs{display:flex;align-items:center;height:36px;padding:5px 8px 0;gap:2px;overflow:hidden}
.tab{display:flex;align-items:center;gap:6px;height:31px;min-width:0;flex:0 1 220px;padding:0 6px 0 12px;border-radius:9px 9px 0 0;color:var(--muted);font-size:12.5px;cursor:default;position:relative}
.tab:hover{background:var(--bg-hover);color:#c8cbd0}
.tab.active{background:var(--active);color:var(--fg)}
.tab .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:31px}
.tab .x{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;color:inherit;cursor:pointer}
.tab .x:hover{background:rgba(255,255,255,.18)}
.tab .x svg{width:9px;height:9px;display:block}
.tab:not(.active)::after{content:'';position:absolute;right:-1px;top:8px;bottom:8px;width:1px;background:#3c4043}
.tab:hover::after,.tab.active::after{display:none}
#newtab{width:28px;height:28px;flex:none;margin-left:4px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);cursor:pointer}
#newtab:hover{background:var(--bg-hover);color:var(--fg)}
#newtab svg{width:14px;height:14px;display:block}
#nav{display:flex;align-items:center;height:44px;padding:0 10px;gap:4px;background:var(--active)}
.btn{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#c8cbd0;cursor:pointer;border:none;background:none}
.btn:hover{background:rgba(255,255,255,.1);color:var(--fg)}
.btn svg{width:17px;height:17px;display:block}
#urlwrap{flex:1;display:flex;align-items:center;height:32px;margin:0 6px;background:var(--bg);border-radius:16px;padding:0 6px 0 14px;border:1px solid transparent;min-width:0}
#urlwrap:focus-within{border-color:var(--accent);background:#28292c}
#url{flex:1;background:none;border:none;outline:none;color:var(--fg);font-size:13px;height:100%;min-width:0;-webkit-user-select:text;user-select:text}
#url::placeholder{color:#7d8288}
</style>
</head>
<body>
<div id="tabs"></div>
<div id="nav">
  <button class="btn" id="btnBack" title="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button class="btn" id="btnFwd" title="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="btn" id="btnReload" title="Обновить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
  <button class="btn" id="btnHome" title="Домой"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
  <div id="urlwrap"><input id="url" placeholder="Поиск или адрес" spellcheck="false"></div>
  <button class="btn" id="btnMenu" title="Настройки"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
</div>
<script>
function post(o){
  var m=JSON.stringify(o);
  try{
    if(window.ipc&&window.ipc.postMessage){window.ipc.postMessage(m);return;}
    if(window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage){window.chrome.webview.postMessage(m);return;}
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.ipc){window.webkit.messageHandlers.ipc.postMessage(m);return;}
  }catch(e){}
}

var tabsEl=document.getElementById('tabs');
var urlEl=document.getElementById('url');
var CLOSE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

window.__ruvaSetTabs=function(data){
  tabsEl.style.display=(data.show===false)?'none':'flex';
  tabsEl.innerHTML='';
  (data.tabs||[]).forEach(function(t){
    var el=document.createElement('div');
    el.className='tab'+(t.active?' active':'');
    el.title=t.title||'Новая вкладка';
    var lbl=document.createElement('span');
    lbl.className='t';
    lbl.textContent=t.title||'Новая вкладка';
    el.appendChild(lbl);
    var x=document.createElement('span');
    x.className='x';x.title='Закрыть';x.innerHTML=CLOSE_SVG;
    x.addEventListener('click',function(e){e.stopPropagation();post({cmd:'close_tab',id:t.id});});
    el.appendChild(x);
    el.addEventListener('click',function(){if(!t.active)post({cmd:'switch_tab',id:t.id});});
    el.addEventListener('auxclick',function(e){if(e.button===1){e.preventDefault();post({cmd:'close_tab',id:t.id});}});
    tabsEl.appendChild(el);
  });
  var plus=document.createElement('div');
  plus.id='newtab';plus.title='Новая вкладка (Ctrl+T)';
  plus.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  plus.addEventListener('click',function(){post({cmd:'new_tab'});});
  tabsEl.appendChild(plus);
};

window.__ruvaSetUrl=function(u){
  if(document.activeElement!==urlEl)urlEl.value=u||'';
};

window.__ruvaFocusUrl=function(){urlEl.focus();urlEl.select();};

urlEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!(e.isComposing||e.keyCode===229)){
    post({cmd:'navigate',url:urlEl.value});
    urlEl.blur();
  }
});
urlEl.addEventListener('focus',function(){urlEl.select();});

document.getElementById('btnBack').addEventListener('click',function(){post({cmd:'back'});});
document.getElementById('btnFwd').addEventListener('click',function(){post({cmd:'forward'});});
document.getElementById('btnReload').addEventListener('click',function(){post({cmd:'reload'});});
document.getElementById('btnHome').addEventListener('click',function(){post({cmd:'navigate',url:''});});
document.getElementById('btnMenu').addEventListener('click',function(){post({cmd:'open_settings'});});

document.addEventListener('keydown',function(e){
  if(!e.ctrlKey||e.altKey||e.shiftKey)return;
  var k=(e.key||'').toLowerCase();
  if(k==='t'){e.preventDefault();post({cmd:'new_tab'});}
  else if(k==='w'){e.preventDefault();post({cmd:'close_tab'});}
  else if(k==='r'){e.preventDefault();post({cmd:'reload'});}
});

post({cmd:'get_tabs'});
</script>
</body>
</html>
